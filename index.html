<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pawday — Pet Feeding Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <aside class="sidebar">
      <a class="brand" href="#" aria-label="Pawday home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32"><path d="M16 13c-4.7 0-8 3.7-8 8.3C8 25 11 27 16 27s8-2 8-5.7C24 16.7 20.7 13 16 13Z"/><circle cx="7.5" cy="10.5" r="3.5"/><circle cx="24.5" cy="10.5" r="3.5"/><circle cx="12" cy="5.5" r="3"/><circle cx="20" cy="5.5" r="3"/></svg>
        </span>
        <span>Pawday</span>
      </a>

      <nav class="nav" aria-label="Main navigation">
        <button class="nav-item active" data-page="calendar">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>
          Calendar
        </button>
        <button class="nav-item" data-page="analytics">
          <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
          Analytics
        </button>
      </nav>

      <div class="sidebar-pets">
        <div class="section-label">My pets</div>
        <div id="sidebarPets"></div>
      </div>

      <button class="sidebar-action" id="openSettings" aria-label="Pet Configuration">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-1.8 1.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-2.6V20a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L7.6 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 6.4 14h-.2v-2.6h.2A1.7 1.7 0 0 0 8 10.4a1.7 1.7 0 0 0-.3-1.9l-.1-.1L9.4 6.6l.1.1a1.7 1.7 0 0 0 1.9.3A1.7 1.7 0 0 0 12.4 5v-.2H15V5a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 8l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2V14H21a1.7 1.7 0 0 0-1.6 1Z"/></svg>
        Pet Configuration
      </button>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <p class="eyebrow" id="todayLabel"></p>
          <h1 id="pageTitle">Feeding schedule</h1>
        </div>
        <div class="topbar-actions">
          <button class="secondary-button" id="howToUse" type="button" aria-label="How to Use: start a guided tour"><span aria-hidden="true">?</span> How to Use</button>
          <button class="primary-button" id="addEntry"><span>+</span> Add feeding</button>
        </div>
      </header>

      <section id="calendarPage" class="page active">
        <div class="view-toolbar">
          <div class="view-tabs" id="viewTabs" aria-label="Calendar view">
            <button data-view="day">Day</button>
            <button class="active" data-view="week">Week</button>
            <button data-view="month">Month</button>
            <button data-view="year">Year</button>
          </div>
          <div class="date-controls">
            <button class="icon-button" id="prevDate" aria-label="Previous period">‹</button>
            <button class="today-button" id="goToday">Today</button>
            <button class="icon-button" id="nextDate" aria-label="Next period">›</button>
          </div>
        </div>

        <section class="pet-strip" id="petStrip" aria-label="Pet feeding counters"></section>
        <section class="calendar-card">
          <div class="calendar-heading" id="calendarHeading"></div>
          <div id="calendar"></div>
        </section>
      </section>

      <section id="analyticsPage" class="page">
        <div class="analytics-grid">
          <article class="stat-card">
            <span class="stat-icon coral">✓</span>
            <div><p>Feedings this week</p><strong id="weekStat">0</strong></div>
          </article>
          <article class="stat-card">
            <span class="stat-icon gold">◎</span>
            <div><p>On-time rate</p><strong id="rateStat">—</strong></div>
          </article>
          <article class="stat-card">
            <span class="stat-icon blue">♧</span>
            <div><p>Most active pet</p><strong id="activePetStat">—</strong></div>
          </article>
        </div>
        <article class="chart-card">
          <div class="chart-header"><div><p class="section-label">Last 7 days</p><h2>Feeding activity</h2></div><div class="chart-legend" id="barLegend"></div></div>
          <div class="bar-chart" id="barChart"></div>
        </article>
        <article class="breakdown">
          <p class="section-label">By pet</p>
          <div id="petBreakdown"></div>
        </article>
      </section>
    </main>

    <div class="modal-backdrop" id="entryModal" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="entryTitle">
        <button class="modal-close" data-close="entryModal" aria-label="Close">×</button>
        <h2 id="entryTitle">Log a feeding</h2>
        <form id="entryForm">
          <label>Pet<select id="entryPet" required></select></label>
          <label>Date<input id="entryDate" type="date" required /></label>
          <label>Time<input id="entryTime" type="time" required /></label>
          <label id="entrySlotLabel" hidden>Fulfils expected time<select id="entrySlot"></select></label>
          <div class="modal-actions"><button type="button" class="secondary-button" data-close="entryModal">Cancel</button><button class="primary-button" type="submit">Save feeding</button></div>
        </form>
      </div>
    </div>

    <div class="modal-backdrop" id="settingsModal" hidden>
      <div class="modal wide" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
        <button class="modal-close" data-close="settingsModal" aria-label="Close">×</button>
        <h2 id="settingsTitle">Pet Configuration</h2>
        <div id="petSettings"></div>
        <form id="petForm" class="pet-form">
          <input id="petName" placeholder="Pet name" aria-label="Pet name" required />
          <select id="petEmoji" aria-label="Pet icon"></select>
          <input id="petFeedings" type="number" min="1" max="12" value="2" aria-label="Feedings per day" required />
          <button class="primary-button" type="submit">Add pet</button>
        </form>
        <div class="settings-footer">
          <span id="settingsStatus" class="settings-status" role="status" aria-live="polite">No changes</span>
          <button type="button" class="secondary-button" data-close="settingsModal">Cancel</button>
          <button type="button" class="primary-button" id="saveSettings" disabled>Save changes</button>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
    <script src="tour.js"></script>
  </body>
</html>
